name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (install script)
        run: shellcheck -x scripts/matrix_up.sh

      - name: bash syntax
        run: bash -n scripts/matrix_up.sh

      - name: node syntax (xray scripts)
        run: |
          for f in scripts/dependency/*.js; do
            node --check "$f"
          done

      - name: versions are consistent
        run: |
          tag=$(sed -n 's/^RELEASE_TAG="\(.*\)"/\1/p' scripts/matrix_up.sh)
          pb_script=$(sed -n 's/^PLAYBOOK_VERSION="\(.*\)"/\1/p' scripts/matrix_up.sh)
          pb_template=$(sed -n 's/^matrix_playbook_migration_validated_version: *//p' configs/vars.yml)
          echo "release=$tag playbook(script)=$pb_script playbook(template)=$pb_template"
          [ -n "$tag" ] && [ -n "$pb_script" ]
          [ "$pb_script" = "$pb_template" ] || { echo "PLAYBOOK_VERSION не совпадает с шаблоном"; exit 1; }
          grep -q "refs/tags/$tag/scripts/matrix_up.sh" README.md || { echo "README.md ссылается не на $tag"; exit 1; }
          grep -q "refs/tags/$tag/scripts/matrix_up.sh" README_EN.MD || { echo "README_EN.MD ссылается не на $tag"; exit 1; }

      - name: vars.yml template parses as YAML
        run: |
          sudo apt-get install -y -qq python3-yaml
          python3 -c "import yaml; yaml.safe_load(open('configs/vars.yml', encoding='utf-8')); print('ok')"
